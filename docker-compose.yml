services:
  tongmu:
    build:
      context: .
      dockerfile: Dockerfile.linux-browser
      args:
        TONGMU_BUILD_SHA: "${TONGMU_BUILD_SHA:-development}"
    # 推荐部署先执行：cp .env.example .env
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "3333"
      NODE_ENV: "production"
      MEDIA_BROWSER_RESOLVER: "${MEDIA_BROWSER_RESOLVER:-true}"
      MEDIA_BROWSER_MAX_CONCURRENCY: "${MEDIA_BROWSER_MAX_CONCURRENCY:-1}"
    ports:
      - "127.0.0.1:3333:3333"
      - "3334:3334"
    # Playwright Chromium 需要更大的 shared memory，避免页面解析时崩溃。
    shm_size: "1gb"
    # 该 volume 名称故意保留，避免已有部署因品牌改名看不到旧数据。
    volumes:
      - zviewer-browser-data:/app/config
    restart: unless-stopped

volumes:
  zviewer-browser-data:
