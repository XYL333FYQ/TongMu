name: TongMu Docker browser smoke

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      export_image:
        type: boolean
        default: false

concurrency:
  group: tongmu-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: tongmu-smoke
      TONGMU_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deployment safeguards
        run: python3 scripts/deploy/test_prebuilt_image.py

      - name: Prepare isolated Compose configuration
        run: cp .env.example .env

      - name: Validate Compose and build browser image
        run: |
          docker compose config --quiet
          docker compose build

      - name: Seed a historical database into the fresh config volume
        run: |
          volume="${COMPOSE_PROJECT_NAME}_zviewer-browser-data"
          docker volume create "$volume"
          docker compose create tongmu
          image="$(docker compose images -q tongmu)"
          test -n "$image"
          docker run --rm -v "$volume:/app/config" --entrypoint node "$image" -e '
            const fixture = require("/app/backend/test/fixtures/historical-database-fixtures.js");
            fixture.buildHistoricalFixture({ fixtureId: "tongmu-71ba034", databasePath: "/app/config/dev.sqlite", configDir: "/app/config" })
              .then(() => process.stdout.write("historical fixture ready\n"))
              .catch((error) => { console.error(error); process.exit(1); });
          '

      - name: Fresh start, migration, health, and build identity
        run: |
          docker compose up -d
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3333/health > health.json; then break; fi
            sleep 2
          done
          node -e '
            const fs = require("fs");
            const health = JSON.parse(fs.readFileSync("health.json", "utf8"));
            if (health.status !== "ok" || health.version !== "1.0.0" || health.commitSha !== process.env.TONGMU_BUILD_SHA) {
              throw new Error(`unexpected health identity: ${JSON.stringify(health)}`);
            }
          '
          docker compose exec -T tongmu sh -lc 'test -f /app/config/dev.sqlite && test -n "$(find /app/config/backups -type f -print -quit)"'
          docker compose exec -T tongmu node -e '
            const fs = require("fs");
            const initSqlJs = require("sql.js");
            initSqlJs().then((SQL) => {
              const db = new SQL.Database(fs.readFileSync("/app/config/dev.sqlite"));
              const rows = db.exec("SELECT username FROM user WHERE id = 11");
              if (rows[0]?.values[0]?.[0] !== "历史用户") throw new Error("historical user was not preserved");
              const migrations = db.exec("SELECT COUNT(*) FROM migrations");
              if (!migrations[0] || Number(migrations[0].values[0][0]) < 1) throw new Error("migrations were not recorded");
            }).catch((error) => { console.error(error); process.exit(1); });
          '

      - name: Chromium, BrowserResolver fallback, and media runtime smoke
        run: |
          docker compose exec -T tongmu node backend/dist/index.js --browser-runtime-smoke
          docker compose exec -T tongmu node backend/dist/index.js --browser-resolver-smoke
          docker compose exec -T tongmu node backend/dist/index.js --media-runtime-smoke

      - name: Config persistence across container recreation
        run: |
          docker compose exec -T tongmu sh -lc 'printf persistence-ok > /app/config/docker-persistence-marker'
          docker compose up -d --force-recreate
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3333/health > /dev/null; then break; fi
            sleep 2
          done
          docker compose exec -T tongmu grep -qx persistence-ok /app/config/docker-persistence-marker
          docker compose exec -T tongmu test -f /app/config/secret-vault.json

      - name: Recover after an unclean stop with a reused container PID
        run: |
          original="$(docker compose ps -q tongmu)"
          docker compose kill -s SIGKILL tongmu
          docker compose up -d --no-build
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3333/health > health.json; then break; fi
            sleep 2
          done
          test "$original" = "$(docker compose ps -q tongmu)"
          docker compose exec -T tongmu node -e '
            const fs = require("fs");
            const lock = JSON.parse(fs.readFileSync("/app/config/database-migration.lock", "utf8"));
            if (lock.pid !== 1 || !lock.processIdentity) throw new Error("missing PID 1 start identity");
            if (!fs.readdirSync("/app/config").some(name => name.startsWith("database-migration.lock.stale-"))) throw new Error("old lock was not archived");
          '
          node -e 'const h = require("./health.json"); if (h.status !== "ok" || h.commitSha !== process.env.TONGMU_BUILD_SHA) process.exit(1)'

      - name: Export the verified production image
        if: inputs.export_image
        shell: bash
        run: |
          set -Eeuo pipefail
          image="$(docker compose images -q tongmu)"
          docker tag "$image" "tongmu-release:$TONGMU_BUILD_SHA"
          mkdir -p "$RUNNER_TEMP/tongmu-image"
          docker image inspect --format '{{.Id}}' "$image" > "$RUNNER_TEMP/tongmu-image/image-id.txt"
          docker image inspect "$image" | python3 scripts/deploy/image_identity.py > "$RUNNER_TEMP/tongmu-image/image-content.sha256"
          cp scripts/deploy/image_identity.py "$RUNNER_TEMP/tongmu-image/image_identity.py"
          docker image inspect --format '{{.Size}}' "$image" > "$RUNNER_TEMP/tongmu-image/image-size.txt"
          docker save "tongmu-release:$TONGMU_BUILD_SHA" | gzip -1 > "$RUNNER_TEMP/tongmu-image/image.tar.gz"
          cd "$RUNNER_TEMP/tongmu-image"
          sha256sum image.tar.gz > image.sha256

      - name: Upload the verified image
        if: inputs.export_image
        uses: actions/upload-artifact@v4
        with:
          name: tongmu-image-${{ github.sha }}
          path: ${{ runner.temp }}/tongmu-image/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Failure diagnostics
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup
        if: always()
        run: |
          docker compose down --volumes --remove-orphans || true
          rm -f .env health.json
