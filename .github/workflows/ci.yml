name: TongMu CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend typecheck
        run: npm run lint -w backend

      - name: Backend tests
        run: npm test -w backend

      - name: Frontend tests
        run: npm test -w frontend

      - name: Frontend build
        run: npm run build -w frontend

      - name: Install Chrome for E2E media coverage
        run: npx playwright install --with-deps chrome

      - name: Prepare FFmpeg for portable media fixtures
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Prepare safe E2E environment
        run: cp .env.example .env

      - name: E2E tests
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: npm run test:e2e -- --reporter=line

      - name: Validate recommended Compose
        run: docker compose config --quiet
