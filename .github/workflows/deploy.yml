name: Deploy TongMu

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tongmu-production
  cancel-in-progress: false

jobs:
  image:
    name: Build and verify on GitHub
    uses: ./.github/workflows/docker.yml
    with:
      export_image: true

  deploy:
    name: Deploy verified image to VPS
    needs: image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Download the verified image
        uses: actions/download-artifact@v4
        with:
          name: tongmu-image-${{ github.sha }}
          path: image

      - name: Prepare SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/tongmu_actions
          chmod 600 ~/.ssh/tongmu_actions
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer and start the verified image
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_ID" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          archive_bytes="$(stat -c %s image/image.tar.gz)"
          image_bytes="$(cat image/image-size.txt)"
          [[ "$archive_bytes" =~ ^[0-9]+$ && "$image_bytes" =~ ^[0-9]+$ ]]
          ssh_options=(-i ~/.ssh/tongmu_actions -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$VPS_PORT")
          staging="/opt/TongMu.deploy/$DEPLOY_ID"
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            "bash -se -- prepare '$DEPLOY_SHA' '$DEPLOY_ID' '$archive_bytes' '$image_bytes'" < scripts/deploy/prebuilt-image.sh
          cleanup_remote() {
            ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
              "bash -se -- cleanup '$DEPLOY_SHA' '$DEPLOY_ID'" < scripts/deploy/prebuilt-image.sh || true
          }
          trap cleanup_remote EXIT
          scp -i ~/.ssh/tongmu_actions -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -P "$VPS_PORT" \
            image/image.tar.gz image/image.sha256 image/image-id.txt \
            "$VPS_USER@$VPS_HOST:$staging/"
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            "bash -se -- deploy '$DEPLOY_SHA' '$DEPLOY_ID'" < scripts/deploy/prebuilt-image.sh
