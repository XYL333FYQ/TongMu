name: TongMu production diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      DEPLOY_TARGET_GUARD: ${{ vars.DEPLOY_TARGET_GUARD }}
      VPS_HOST: ${{ vars.PRODUCTION_VPS_HOST }}
      VPS_PORT: ${{ vars.PRODUCTION_VPS_PORT }}
      VPS_USER: ${{ vars.PRODUCTION_VPS_USER }}
      VPS_SSH_HOST_KEY: ${{ vars.PRODUCTION_VPS_HOST_KEY }}
      VPS_SSH_KEY: ${{ secrets.PRODUCTION_VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Inspect only the configured new production VPS
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/deploy/prepare-ssh.sh
          ssh -i ~/.ssh/tongmu_actions -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -se' < scripts/deploy/diagnose-production.sh
