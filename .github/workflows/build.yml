name: Build immutable TongMu release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Same-ref retries serialize/cancel, while main and different tags never share
# a group and therefore cannot cancel or overwrite one another.
concurrency:
  group: tongmu-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Setup pinned npm
        run: npm install --global npm@11.16.0

      - name: Validate tag against the single version source
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          test "$VERSION" = "$TAG_VERSION" || {
            echo "tag $TAG_VERSION does not match package.json $VERSION" >&2
            exit 1
          }

      - name: Install exactly from lockfile
        run: npm ci

      - name: Reject lockfile drift
        run: git diff --exit-code -- package-lock.json

      - name: Backend typecheck and focused release tests
        run: |
          npm run lint -w backend
          npm run build -w backend
          node --test backend/test/phase6b1-release-updater.test.js

      - name: Frontend unit tests and production build
        run: |
          npm test -w frontend
          npm run build -w frontend

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_flag: --win
            platform: windows
            arch: x64
            dist_dir: win
          - os: ubuntu-latest
            build_flag: --linux
            platform: linux
            arch: x64
            dist_dir: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Setup pinned npm
        run: npm install --global npm@11.16.0

      - name: Install exactly from lockfile
        run: npm ci

      - name: Build platform program directory
        run: node build-all.js ${{ matrix.build_flag }}

      - name: Create and verify signed immutable artifact in staging
        id: package_meta
        shell: bash
        env:
          TONGMU_RELEASE_SIGNING_KEY_ID: ${{ secrets.TONGMU_RELEASE_SIGNING_KEY_ID }}
          TONGMU_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.TONGMU_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TONGMU_RELEASE_SIGNING_KEY_ID" || { echo "signing key id secret is missing" >&2; exit 1; }
          test -n "$TONGMU_RELEASE_SIGNING_PRIVATE_KEY" || { echo "signing private key secret is missing" >&2; exit 1; }
          TAG_ARG=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG_ARG="--tag ${GITHUB_REF#refs/tags/}"; fi
          node scripts/release/package-release.js \
            --platform ${{ matrix.platform }} \
            --arch ${{ matrix.arch }} \
            --input-dir dist/${{ matrix.dist_dir }} \
            --output-dir release-output \
            --release-mode \
            $TAG_ARG > "$RUNNER_TEMP/release-meta.json"
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          node scripts/release/verify-release-output.js release-output

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@v6
        with:
          name: TongMu-${{ steps.package_meta.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.package_meta.outputs.sha_short }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 30

# This workflow intentionally does not create or mutate a GitHub Release.
# A separately authorized publish action may attach these already-verified files;
# the updater consumes signed GitHub Release assets, never transient Actions artifacts.
